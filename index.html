<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal Christmas Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: 화면을 채우는 터미널 창 하나. 명령을 치면 같은 창 안에서 트리가 전체 화면 TUI 처럼 재생돼요. */
:root {
  --desk: #07090d;      /* 창 바깥 */
  --win: #0d1016;       /* 터미널 바탕 */
  --bar: #161a22;       /* 제목 막대 */
  --line: #252b36;      /* 테두리 */
  --text: #d5dbe5;      /* 기본 글자 */
  --dim: #7c8596;       /* 흐린 글자 */
  --prompt: #7ee38f;    /* 프롬프트 초록 */
  --gold: #ffcc3a;      /* 강조 금색 */
  --err: #ff7b72;       /* 오류 */
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--desk);
  color: var(--text);
  font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  display: flex;
}
.term {
  flex: 1;
  min-width: 0;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--win);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
}
.bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  color: var(--dim);
}
.dots { display: flex; gap: 7px; flex: 0 0 auto; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a404c; display: block; }
.dots i:nth-child(1) { background: #c9514a; }
.dots i:nth-child(2) { background: #c99a3a; }
.dots i:nth-child(3) { background: #4f9a4f; }
.title { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop {
  flex: 0 0 auto;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  background: #232936;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 9px;
  cursor: pointer;
}
.stop:hover { background: #2c3443; }
.stop:focus-visible, .suggest:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.bar .spacer { width: 47px; flex: 0 0 auto; }
.screen { flex: 1; min-height: 0; position: relative; background: #000; }
.log {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 14px 16px 18px;
  font-size: 14px;
  line-height: 1.55;
  cursor: text;
}
.log p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.dim { color: var(--dim); }
.gold { color: var(--gold); }
.err { color: var(--err); }
.ps { color: var(--prompt); }
.row { display: flex; gap: 1ch; align-items: baseline; }
#cmd {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  padding: 0;
  color: var(--text);
  font: inherit;
  caret-color: var(--prompt);
}
.suggest {
  font: inherit;
  color: var(--gold);
  background: transparent;
  border: 1px dashed #5a4a1e;
  border-radius: 6px;
  padding: 1px 8px;
  cursor: pointer;
}
.suggest:hover { background: #1b1708; }
canvas { position: absolute; display: block; background: #000; }
@media (max-width: 600px) {
  .log { font-size: 12.5px; padding: 12px; }
  .bar .spacer { display: none; }
}
</style>
</head>
<body>

<div class="term" id="term" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
  <div class="bar">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title" id="title">~ — zsh — 96×54</div>
    <button class="stop" id="stop" type="button" hidden>^C Quit</button>
    <span class="spacer" id="spacer" aria-hidden="true"></span>
  </div>
  <div class="screen" id="screen">
    <div class="log" id="log" aria-live="polite">
      <div id="out"></div>
      <div class="row"><span class="ps">~ $</span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-lt-active="false" aria-label="Command input"></div>
    </div>
    <canvas id="cv" hidden aria-label="3D Christmas tree animation drawn with text characters"></canvas>
  </div>
</div>

<script>
"use strict";
// ═══════════════════════ 색 팔레트 (tree.py 와 같아요) ═══════════════════════
const col = (r, g, b) => [r / 255, g / 255, b / 255];
const TREE_DARK = col(16, 78, 38), TREE_LIGHT = col(92, 196, 84), TREE_SNOW = col(230, 242, 255);
const TRUNK = col(118, 72, 38), GROUND_SNOW = col(214, 228, 246), SWIRL = col(228, 240, 255);
const FLASH = col(255, 252, 236), RED = col(216, 30, 42), GOLD = col(240, 178, 38), SILVER = col(196, 204, 220);
const BULB_WARM = col(255, 222, 160), BULB_RED = col(255, 58, 48), BULB_GOLD = col(255, 186, 40), BULB_GREEN = col(70, 255, 112);
const STAR_GOLD = col(255, 204, 58), STAR_RAY = col(255, 232, 150), PINK = col(255, 104, 182);
const GIFT_WHITE = col(236, 236, 242), GIFT_RED = col(204, 34, 46), GIFT_GREEN = col(36, 150, 72);
const GIFT_GOLD = col(226, 170, 44), GIFT_BLUE = col(52, 102, 222), GIFT_PINK = col(238, 120, 176);
const RIBBON_GOLD = col(255, 208, 70), RIBBON_RED = col(226, 36, 52), RIBBON_SILVER = col(226, 232, 244);
const SNOW = col(238, 244, 255);
const SKY_STAR_COLORS = [col(210, 222, 255), col(255, 246, 228), col(255, 228, 180), col(186, 204, 255)];
const MILKY_WAY = col(112, 122, 214), MILKY_WAY_2 = col(176, 112, 196);
const PLANET_SILVER = col(204, 208, 220), PLANET_RING = col(222, 206, 172);
const PLANET_BLUE = col(66, 140, 255), PLANET_PURPLE = col(164, 92, 226);

// ═══════════════════════ 개수 · 속도 · 순서 ═══════════════════════
const N_SKY_STARS = 500, N_ORNAMENTS = 34, N_LIGHTS = 280, LIGHT_TURNS = 5.5;
const N_HEARTS = 10, N_SNOW = 180, SNOW_HEART_RATIO = 0.15, ROT_PERIOD = 17, FPS = 30, HOLD_TIME = 6;
const T_GROUND = 0, D_GROUND = 1.1, T_SWIRL = 0.8, D_SWIRL = 3.1, T_BURST = T_SWIRL + D_SWIRL, D_BURST = 0.8;
const T_ORN = 4.5, D_ORN = 1.8, ORN_POP = 0.25, T_LIGHTS = 6.1, D_LIGHTS = 1.8, T_STAR = 7.8, D_STAR = 0.7;
const T_HEARTS = 8.4, D_HEARTS = 1.1, T_GIFTS = 9.3, D_GIFTS = 1.6, GIFT_RISE = 0.5, T_SNOW = 10.4;
const T_DONE = T_GIFTS + D_GIFTS * 5 / 6 + GIFT_RISE, LOOP = T_DONE + HOLD_TIME;

// ═══════════════════════ 화면 · 카메라 ═══════════════════════
const W = 96, H = 54, SX = 32, SY = 16, CX = W / 2, CY = 26.5, PIVOT = 0.95, PITCH = 0.24, CAM_D = 7;
const RAMP = " .,:;-=+*#%@", CHARS = [...RAMP, "♥"], HEART = RAMP.length;
const TAU = Math.PI * 2, CP = Math.cos(PITCH), SPt = Math.sin(PITCH);
const unit = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
const L = unit([-0.55, 0.62, -0.56]);
const HF = unit([L[0], L[1], L[2] - 1]);

const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const easeOut = x => { x = clamp01(x); return 1 - (1 - x) ** 3; };
const backOut = x => { x = clamp01(x); const c1 = 1.70158; return 1 + (c1 + 1) * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const rotAngle = T => TAU * T / ROT_PERIOD;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(1225);
const U = (a, b) => a + (b - a) * rand();
const N01 = () => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(TAU * rand());
const nrm3 = (x, y, z) => { const l = Math.hypot(x, y, z) || 1e-9; return [x / l, y / l, z / l]; };

// ═══════════════════════ 모양 만들기 (처음 한 번) ═══════════════════════
const TIERS = [[0.16, 1.04, 0.95], [0.74, 1.38, 0.70], [1.05, 1.68, 0.52], [1.38, 1.98, 0.33]];
const TREE_TOP = 1.98, SWIRL_H = TREE_TOP + 0.06, STAR_Y = TREE_TOP + 0.10, STAR_R = 0.21;
const GROUND_R = 1.35, ORN_R = 0.075;

function tierRadius(y) {
  let r = 0;
  for (const [yb, yt, rb] of TIERS) { const t = (yt - y) / (yt - yb); if (t >= 0 && t <= 1) r = Math.max(r, rb * t); }
  return r;
}
function PS() { return { P: [], N: [], C: [], X: [] }; }
function push(ps, p, n, c, x) {
  ps.P.push(p[0], p[1], p[2]); ps.N.push(n[0], n[1], n[2]); ps.C.push(c[0], c[1], c[2]);
  if (x !== undefined) ps.X.push(x);
}
function fin(ps) {
  return { n: ps.P.length / 3, P: new Float32Array(ps.P), N: new Float32Array(ps.N), C: new Float32Array(ps.C), X: new Float32Array(ps.X) };
}
function fibSphere(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const k = i + 0.5, phi = Math.acos(1 - 2 * k / n), th = Math.PI * (1 + Math.sqrt(5)) * k;
    out.push([Math.cos(th) * Math.sin(phi), Math.cos(phi), Math.sin(th) * Math.sin(phi)]);
  }
  return out;
}

function buildTree() {
  const ps = PS();
  const areas = TIERS.map(([yb, yt, rb]) => Math.PI * rb * Math.hypot(rb, yt - yb));
  const sum = areas.reduce((a, b) => a + b, 0);
  TIERS.forEach(([yb, yt, rb], ti) => {
    const n = Math.floor(14000 * areas[ti] / sum), h = yt - yb;
    for (let i = 0; i < n; i++) {
      const phi = U(0, TAU);
      const hem = 1 - 0.10 * (0.5 + 0.5 * Math.sin(9 * phi + 1.7 * ti)) ** 2;
      const t = Math.sqrt(rand()) * hem;
      const bump = 1 + 0.045 * Math.sin(15 * phi + 22 * t + ti) - U(0, 0.07);
      const r = rb * t * bump, y = yt - t * h - 0.05 * t ** 8;
      const nn = nrm3(h * Math.cos(phi), rb, h * Math.sin(phi));
      let nx = nn[0] + 0.28 * N01(), ny = nn[1] + 0.28 * N01(), nz = nn[2] + 0.28 * N01();
      const m = clamp01(0.55 * rand() + 0.3 * (0.5 + 0.5 * Math.sin(11 * phi + 17 * t + ti)) + 0.25 * t - 0.1);
      let c = [0, 1, 2].map(j => TREE_DARK[j] + (TREE_LIGHT[j] - TREE_DARK[j]) * m);
      if (ti + 1 < TIERS.length) {                       // 위층 치맛단 밑 그늘 → 층이 보이게
        const f = 0.3 + 0.7 * clamp01((r - TIERS[ti + 1][2]) / 0.16);
        c = c.map(v => v * f);
      }
      const edge = clamp01((t / hem - 0.8) / 0.2), hs = ti === 0 ? 0.08 : 0.35;
      if (rand() < edge * edge * hs * (0.55 + 0.45 * Math.sin(7 * phi + 2 * ti)) + 0.012) {
        const k = 0.88 + 0.12 * rand(); c = TREE_SNOW.map(v => v * k); ny += 0.9;
      }
      push(ps, [r * Math.cos(phi), y, r * Math.sin(phi)], nrm3(nx, ny, nz), c);
    }
  });
  for (let i = 0; i < 1400; i++) {                       // 갈색 기둥
    const phi = U(0, TAU), y = U(0, 0.55);
    const bark = 0.72 + 0.18 * Math.sin(phi * 9 + y * 30) + 0.1 * rand();
    push(ps, [0.11 * Math.cos(phi), y, 0.11 * Math.sin(phi)],
      nrm3(Math.cos(phi) + 0.15 * N01(), 0.15 * N01(), Math.sin(phi) + 0.15 * N01()), TRUNK.map(v => v * bark));
  }
  return fin(ps);
}

function buildGround() {
  const ps = PS(), R2 = GROUND_R * GROUND_R;
  for (let i = 0; i < 9000; i++) {
    const phi = U(0, TAU), rn = Math.sqrt(rand());
    const edge = 1 + 0.04 * Math.sin(5 * phi) + 0.03 * Math.sin(9 * phi + 1);
    const r = GROUND_R * edge * rn, x = r * Math.cos(phi), z = r * Math.sin(phi);
    const y = 0.02 * Math.sin(6 * x + 1) * Math.sin(5 * z) + 0.04 * (1 - r * r / R2);
    const dydx = 0.12 * Math.cos(6 * x + 1) * Math.sin(5 * z) - 0.08 * x / R2;
    const dydz = 0.10 * Math.sin(6 * x + 1) * Math.cos(5 * z) - 0.08 * z / R2;
    const ao = 0.55 + 0.45 * clamp01((r - 0.15) / 0.75), k = (0.92 + 0.08 * rand()) * ao;
    push(ps, [x, y, z], nrm3(-dydx + 0.12 * N01(), 1 + 0.12 * N01(), -dydz + 0.12 * N01()), GROUND_SNOW.map(v => v * k), rn);
  }
  for (let i = 0; i < 1500; i++) {                       // 땅 가장자리 두께
    const phi = U(0, TAU), er = GROUND_R * (1 + 0.04 * Math.sin(5 * phi) + 0.03 * Math.sin(9 * phi + 1));
    const k = 0.85 + 0.1 * rand();
    push(ps, [er * Math.cos(phi), U(-0.05, 0), er * Math.sin(phi)], nrm3(Math.cos(phi), 0.3, Math.sin(phi)), GROUND_SNOW.map(v => v * k), 1);
  }
  return fin(ps);
}

const GIFT_DEFS = [
  [0.34, 0.26, 0.30, GIFT_RED, RIBBON_GOLD], [0.24, 0.32, 0.24, GIFT_WHITE, RIBBON_RED],
  [0.40, 0.18, 0.28, GIFT_GREEN, RIBBON_GOLD], [0.22, 0.22, 0.22, GIFT_GOLD, RIBBON_RED],
  [0.30, 0.24, 0.34, GIFT_BLUE, RIBBON_SILVER], [0.20, 0.34, 0.20, GIFT_PINK, RIBBON_SILVER],
];
const GIFT_SLOTS = [0, 1, 2, 3, 4, 5].map(k => [(20 + 60 * k) * Math.PI / 180, k % 2 === 0 ? 1.00 : 1.08]);
const RIBBON_W = 0.03;

function buildBox(w, h, d, body, ribbon) {
  const ps = PS(), dens = 4500;
  const add = (p, n, rib) => {
    const k = 0.92 + 0.08 * rand();
    push(ps, p, n, rib ? ribbon : body.map(v => v * k), rib ? 0.5 : 0.12);
  };
  let n = Math.floor(w * d * dens);
  for (let i = 0; i < n; i++) { const x = U(-w / 2, w / 2), z = U(-d / 2, d / 2); add([x, h, z], [0, 1, 0], Math.abs(x) < RIBBON_W || Math.abs(z) < RIBBON_W); }
  for (const s of [1, -1]) {
    n = Math.floor(d * h * dens);
    for (let i = 0; i < n; i++) { const z = U(-d / 2, d / 2), y = U(0, h); add([s * w / 2, y, z], [s, 0, 0], Math.abs(z) < RIBBON_W || Math.abs(y - h / 2) < RIBBON_W * 0.8); }
  }
  for (const s of [1, -1]) {
    n = Math.floor(w * h * dens);
    for (let i = 0; i < n; i++) { const x = U(-w / 2, w / 2), y = U(0, h); add([x, y, s * d / 2], [0, 0, s], Math.abs(x) < RIBBON_W || Math.abs(y - h / 2) < RIBBON_W * 0.8); }
  }
  const sph = fibSphere(70);                             // 위에 매듭 (고리 두 개 + 가운데 매듭)
  for (const [sc, ctr] of [[[0.062, 0.042, 0.03], [0.052, h + 0.032, 0]], [[0.062, 0.042, 0.03], [-0.052, h + 0.032, 0]], [[0.028, 0.026, 0.028], [0, h + 0.022, 0]]]) {
    for (const s of sph) push(ps, [s[0] * sc[0] + ctr[0], s[1] * sc[1] + ctr[1], s[2] * sc[2] + ctr[2]], nrm3(s[0] / sc[0], s[1] / sc[1], s[2] / sc[2]), ribbon, 0.6);
  }
  return fin(ps);
}

const TREE = buildTree();
const GRD = buildGround();
const ORN = (() => {
  const ctr = [], cl = [], sp = [];
  for (let i = 0; i < N_ORNAMENTS; i++) {
    const y = 0.30 + (1.82 - 0.30) * i / (N_ORNAMENTS - 1) + U(-0.03, 0.03);
    const phi = i * 2.39996 + U(-0.3, 0.3), r = tierRadius(y) + 0.02;
    ctr.push([r * Math.cos(phi), y, r * Math.sin(phi)]);
    cl.push([RED, GOLD, SILVER][i % 3]); sp.push([0.7, 0.8, 1.1][i % 3]);
  }
  const w = [], ph = [];
  for (let i = 0; i < N_ORNAMENTS; i++) w.push(U(1.5, 4.0));
  for (let i = 0; i < N_ORNAMENTS; i++) ph.push(U(0, TAU));
  return { ctr, cl, sp, w, ph };
})();
const SPHERE = fibSphere(90);
const LT = (() => {
  const u = [], P = [], C = [], w = [], ph = [];
  const pal = [BULB_WARM, BULB_RED, BULB_GOLD, BULB_GREEN];
  for (let i = 0; i < N_LIGHTS; i++) {
    const uu = i / (N_LIGHTS - 1), y = 0.22 + uu * 1.71, phi = uu * LIGHT_TURNS * TAU, r = tierRadius(y) + 0.03;
    u.push(uu); P.push([r * Math.cos(phi), y, r * Math.sin(phi)]); C.push(pal[i % 4]);
  }
  for (let i = 0; i < N_LIGHTS; i++) w.push(U(2.0, 6.5));
  for (let i = 0; i < N_LIGHTS; i++) ph.push(U(0, TAU));
  return { u, P, C, w, ph };
})();
const GIFTS = GIFT_DEFS.map(g => buildBox(...g));

const SKY = (() => {
  const th = 27 * Math.PI / 180;
  let n = new Float32Array(W * H);
  for (let i = 0; i < n.length; i++) n[i] = rand();
  const at = (a, r, c) => a[((r + H) % H) * W + ((c + W) % W)];
  for (let it = 0; it < 4; it++) {
    const m = new Float32Array(W * H);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      m[r * W + c] = (at(n, r, c) + at(n, r - 1, c) + at(n, r + 1, c) + at(n, r, c - 1) + at(n, r, c + 1) + at(n, r, c - 2) + at(n, r, c + 2)) / 7;
    }
    n = m;
  }
  let lo = Infinity, hi = -Infinity;
  for (const v of n) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const milky = new Float32Array(W * H * 3);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c, nv = (n[i] - lo) / (hi - lo);
    const sd = (c - W * 0.5) * Math.sin(th) + (r - H * 0.42) * 2 * Math.cos(th);
    let inten = Math.exp(-((sd / 11) ** 2)) * (0.25 + 0.95 * nv ** 1.5) * 0.10;
    inten *= 1 - 0.55 * Math.exp(-(((sd - 1.5) / 2.2) ** 2));
    const mx = clamp01(c / W);
    for (let j = 0; j < 3; j++) milky[i * 3 + j] = inten * (MILKY_WAY[j] * (1 - mx) + MILKY_WAY_2[j] * mx);
  }
  const idx = [...Array(W * H).keys()];
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const cell = idx.slice(0, N_SKY_STARS);
  const base = cell.map(() => 0.10 + 0.75 * rand() ** 2.4);
  const scol = cell.map(() => SKY_STAR_COLORS[Math.floor(rand() * SKY_STAR_COLORS.length)]);
  const w = cell.map(() => U(0.6, 4.5)), ph = cell.map(() => U(0, TAU));
  return { milky, cell, base, scol, w, ph };
})();

const PLANETS = [
  { cx: 15.0, cy: 9.0, rad: 6.5, color: PLANET_SILVER, ring: true, tilt: -0.38, band: 0.06, freq: 9, ph: 0 },
  { cx: 84.5, cy: 10.0, rad: 6.0, color: PLANET_BLUE, ring: false, tilt: 0, band: 0.12, freq: 7, ph: 1.7 },

      ovl.push([PC, PR, VZ, HEART, PINK[0] * k, PINK[1] * k, PINK[2] * k]);
    } else {
      ovl.push([PC, PR, VZ, near ? 8 : mid ? 7 : 1, SNOW[0] * bright, SNOW[1] * bright, SNOW[2] * bright]);
    }
  }
}

const HALO = [[0, 0, 1], [-1, 0, 0.45], [1, 0, 0.45], [0, -1, 0.22], [0, 1, 0.22]];
function render(tl, T, st) {
  const fade = clamp01((LOOP - tl) / 0.45);             // 다시 시작하기 직전 살짝 어두워짐
  drawSky(T);
  zbuf.fill(Infinity); glow.fill(0); gN = 0; ovl = [];
  setRot(rotAngle(T));
  drawGround(tl); drawTree(tl); drawSwirl(tl); drawBurst(tl); drawOrnaments(tl, T);
  drawLights(tl, T); drawStar(tl, T); drawHearts(tl, T, st); drawGifts(tl, st);
  drawSnow(tl, T);
  for (let k = 0; k < gN; k++) {                         // 빛: 겹치면 더 밝게, 트리 뒤에선 숨기
    const c0 = Math.floor(gc[k]), r0 = Math.floor(gr[k]), nOff = gh[k] ? 5 : 1;
    for (let o = 0; o < nOff; o++) {
      const c = c0 + HALO[o][0], r = r0 + HALO[o][1];
      if (c < 0 || c >= W || r < 0 || r >= H) continue;
      const i = r * W + c;
      if (gz[k] < zbuf[i] + 0.08) { const w = HALO[o][2]; glow[i * 3] += gR[k] * w; glow[i * 3 + 1] += gG[k] * w; glow[i * 3 + 2] += gB[k] * w; }
    }
  }
  const cv = [0, 0, 0];
  for (let i = 0; i < W * H; i++) {
    const a = i * 3, sm = zbuf[i] !== Infinity;
    for (let j = 0; j < 3; j++) {
      const base = sm ? scol[a + j] * fade + bg[a + j] * (1 - fade) : bg[a + j];
      cv[j] = base + glow[a + j] * fade;
    }
    const v = Math.max(cv[0], cv[1], cv[2]), ex = Math.max(v - 1, 0) * 0.85;   // 아주 밝으면 하얗게
    const gv = Math.max(glow[a], glow[a + 1], glow[a + 2]) * fade;
    const solidOn = sm && fade > 0.3, scene = solidOn || gv > 0.03;
    const lv = scene ? clamp01(v) ** 0.7 : clamp01(v) * 1.3;
    let idx = Math.min(11, Math.max(0, Math.round(lv * 11)));
    if (solidOn) idx = Math.max(idx, 1);
    const sp = special[i];
    if (sp >= 0 && !solidOn && gv < 0.25) idx = sp;
    outIdx[i] = idx;
    for (let j = 0; j < 3; j++) outRGB[a + j] = clamp01(cv[j] + ex) ** 0.8 * 255 + 0.5;
  }
  if (fade > 0.05) for (const [cf, rf, z, code, R, G, B] of ovl) {
    const c = Math.floor(cf), r = Math.floor(rf);
    if (c < 0 || c >= W || r < 0 || r >= H) continue;
    const i = r * W + c;
    if (!(z < zbuf[i])) continue;
    outIdx[i] = code;
    outRGB[i * 3] = clamp01(R * fade) ** 0.8 * 255 + 0.5;
    outRGB[i * 3 + 1] = clamp01(G * fade) ** 0.8 * 255 + 0.5;
    outRGB[i * 3 + 2] = clamp01(B * fade) ** 0.8 * 255 + 0.5;
  }
}

// ═══════════════════════ 캔버스 · 재생 ═══════════════════════
const $ = id => document.getElementById(id);
const cvs = $("cv"), ctx = cvs.getContext("2d"), screenEl = $("screen"), logEl = $("log"), outEl = $("out"), cmd = $("cmd");
let cellW = 8, cellH = 16, playing = false, t0 = 0, lastDraw = -1, loopIdx = -1, state = null, rafId = 0;

function layout() {
  const w = screenEl.clientWidth, h = screenEl.clientHeight;
  cellW = Math.max(1, Math.min(w / W, h / (2 * H)));      // 글자 한 칸 = 가로 1 : 세로 2
  cellH = cellW * 2;
  const cw = cellW * W, ch = cellH * H, dpr = window.devicePixelRatio || 1;
  cvs.style.width = cw + "px"; cvs.style.height = ch + "px";
  cvs.style.left = (w - cw) / 2 + "px"; cvs.style.top = (h - ch) / 2 + "px";
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function paint() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, cellW * W, cellH * H);
  ctx.font = `${cellH * 0.82}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let last = "";
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c, code = outIdx[i];
    if (!code) continue;
    const a = i * 3, fs = `rgb(${outRGB[a]},${outRGB[a + 1]},${outRGB[a + 2]})`;
    if (fs !== last) { ctx.fillStyle = fs; last = fs; }
    ctx.fillText(CHARS[code], (c + 0.5) * cellW, (r + 0.5) * cellH);
  }
}
function frame(now) {
  if (!playing) return;
  rafId = requestAnimationFrame(frame);
  if (lastDraw >= 0 && now - lastDraw < 1000 / FPS - 2) return;   // 1초에 30번
  lastDraw = now;
  const T = (now - t0) / 1000, li = Math.floor(T / LOOP), tl = T - li * LOOP;
  if (li !== loopIdx) { loopIdx = li; state = newLoopState(li); }
  render(tl, T, state);
  paint();
}
function startTree() {
  playing = true; loopIdx = -1; lastDraw = -1;
  logEl.hidden = true; cvs.hidden = false; $("stop").hidden = false; $("spacer").hidden = true;
  $("title").textContent = "python3 tree.py — 96×54";
  layout();
  t0 = performance.now();
  rafId = requestAnimationFrame(frame);
  cvs.focus?.();
}
function stopTree() {
  if (!playing) return;
  playing = false; cancelAnimationFrame(rafId);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  cvs.hidden = true; logEl.hidden = false; $("stop").hidden = true; $("spacer").hidden = false;
  $("title").textContent = "~ — zsh — 96×54";
  print("^C", "dim");
  cmd.focus();
  logEl.scrollTop = logEl.scrollHeight;
}

// ═══════════════════════ 가짜 터미널 ═══════════════════════
function print(text, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  outEl.appendChild(p);
}
function printNodes(...parts) {
  const p = document.createElement("p");
  for (const part of parts) p.append(part);
  outEl.appendChild(p);
}
function span(text, cls) { const s = document.createElement("span"); s.className = cls; s.textContent = text; return s; }
function suggestBtn(text) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "suggest"; b.textContent = text;
  b.addEventListener("click", e => { e.stopPropagation(); typeAndRun(text); });
  return b;
}
function welcome() {
  const d = new Date();
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], mons = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
  print(`Last login: ${days[d.getDay()]} ${mons[d.getMonth()]} ${d.getDate()} ${hh}:${mm} on ttys001`, "dim");
  print(" ");
  printNodes(span("  *  ", "gold"), "A 3D Christmas tree drawn with text characters");
  print("     tree.py is in this folder. Type the command below and press Enter.", "dim");
  print(" ");
  printNodes("     ", suggestBtn("python3 tree.py"), span("   play the tree · quit with Ctrl+C or Esc", "dim"));
  print(" ");
  print("     also try: ls  help  clear", "dim");
  print(" ");
}
const history = []; let hIdx = 0;
function run(raw) {
  const line = raw.trim().replace(/\s+/g, " ");
  printNodes(span("~ $ ", "ps"), raw);
  if (line) { history.push(raw); }
  hIdx = history.length;
  if (!line) return;
  const [c0, ...args] = line.split(" ");
  if (/^(python3?|py) (\.\/)?tree\.py$/.test(line) || line === "./tree.py") { startTree(); return; }
  switch (c0) {
    case "ls": print("tree.py"); break;
    case "help":
      print("python3 tree.py   play the tree (quit: Ctrl+C · Esc · q)");
      print("ls                list files");
      print("clear             clear the screen");
      print("echo <text>       print the text");
      break;
    case "clear": outEl.textContent = ""; break;
    case "pwd": print("/home/santa"); break;
    case "whoami": print("santa"); break;
    case "date": print(new Date().toString()); break;
    case "echo": print(args.join(" ")); break;
    case "cat":
      if (args[0] === "tree.py") {
        print("#!/usr/bin/env python3", "dim");
        print("# 3D Christmas tree for the terminal (tree.py)", "dim");
        print("#   run: python3 tree.py      quit: Ctrl+C", "dim");
        print("# ... (rest of the file omitted)", "dim");
      } else print(`cat: ${args[0] || ""}: No such file or directory`, "err");
      break;
    case "python": case "python3":
      if (!args.length) print("This web terminal can only run tree.py:  python3 tree.py", "dim");
      else print(`${c0}: can't open file '${args[0]}': [Errno 2] No such file or directory`, "err");
      break;
    case "sudo": print("santa is not in the sudoers file. This incident will be reported to the North Pole.", "err"); break;
    case "exit": case "logout": print("Close the window or tab to end the session.", "dim"); break;
    default: print(`zsh: command not found: ${c0}`, "err");
  }
}
let typing = false;
function typeAndRun(text) {
  if (typing || playing) return;
  typing = true; cmd.value = ""; cmd.focus();
  let i = 0;
  const step = () => {
    cmd.value = text.slice(0, ++i);
    if (i < text.length) setTimeout(step, 45);
    else setTimeout(() => { typing = false; const v = cmd.value; cmd.value = ""; run(v); logEl.scrollTop = logEl.scrollHeight; }, 220);
  };
  setTimeout(step, 120);
}
cmd.addEventListener("keydown", e => {
  if (e.isComposing) return;
  if (e.key === "Enter") { e.preventDefault(); const v = cmd.value; cmd.value = ""; run(v); logEl.scrollTop = logEl.scrollHeight; }
  else if (e.key === "ArrowUp") { if (hIdx > 0) { hIdx--; cmd.value = history[hIdx]; } e.preventDefault(); }
  else if (e.key === "ArrowDown") { if (hIdx < history.length) { hIdx++; cmd.value = history[hIdx] ?? ""; } e.preventDefault(); }
  else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); outEl.textContent = ""; }
  else if (e.key === "c" && e.ctrlKey && !window.getSelection()?.toString()) { e.preventDefault(); printNodes(span("~ $ ", "ps"), cmd.value + "^C"); cmd.value = ""; }
});
document.addEventListener("keydown", e => {
  if (!playing) return;
  if (e.key === "Escape" || e.key === "q" || (e.key === "c" && e.ctrlKey)) { e.preventDefault(); stopTree(); }
});
$("stop").addEventListener("click", stopTree);
logEl.addEventListener("click", () => { if (!window.getSelection()?.toString()) cmd.focus(); });
new ResizeObserver(() => { if (playing) { layout(); paint(); } }).observe(screenEl);

welcome();
cmd.focus({ preventScroll: true });
document.fonts?.load(`16px "JetBrains Mono"`).catch(() => {});
</script>
</body>
</html>
